<html lang="en">

<title>Drawing like Lebbeus Woods</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=JetBrains+Mono:wght@400;500&family=Spectral:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/* Layout: a drafting sheet. A title-block index on the left lists every sheet; one module sheet at a time fills the right. */
:root {
  --paper: #ECEBE7;
  --surface: #F7F6F3;
  --ink: #1E2123;
  --lead: #585E61;
  --rule: #CCC9C1;
  --accent: #2E5157;
  --sepia: #8A5A46;
  --f-display: "Archivo", "Arial Narrow", Arial, sans-serif;
  --f-body: "Spectral", Georgia, "Times New Roman", serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #141617; --surface: #1B1E1F; --ink: #E6E3DC; --lead: #9DA1A1;
    --rule: #33383A; --accent: #94B8BD; --sepia: #CFA08A; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #141617; --surface: #1B1E1F; --ink: #E6E3DC; --lead: #9DA1A1;
  --rule: #33383A; --accent: #94B8BD; --sepia: #CFA08A; color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 17px;
  line-height: 1.62;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 10; background: var(--paper);
}
a { color: var(--accent); text-underline-offset: 3px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.mono { font-family: var(--f-mono); }
.label {
  font-family: var(--f-mono); font-size: 0.72rem; letter-spacing: 0.08em;
  text-transform: uppercase; color: var(--lead);
}

/* ---------- frame ---------- */
.app {
  display: grid;
  grid-template-columns: 16.5rem minmax(0, 1fr);
  gap: 3.5rem;
  max-width: 78rem;
  margin: 0 auto;
}
.topbar { display: none; }

.nav {
  position: sticky; top: env(safe-area-inset-top, 0px);
  align-self: start;
  max-height: 100vh; overflow-y: auto;
  padding-block: 2rem 2rem;
  display: flex; flex-direction: column; gap: 1.6rem;
}
.brand { display: flex; flex-direction: column; gap: 0.35rem; padding-bottom: 1.2rem; border-bottom: 1px solid var(--ink); }
.brand-title {
  font-family: var(--f-display); font-stretch: 68%; font-weight: 800;
  font-size: 1.55rem; line-height: 1; text-transform: uppercase; letter-spacing: 0.01em;
  color: var(--ink); text-decoration: none;
}
.progress { display: flex; align-items: center; gap: 0.6rem; }
.progress-bar { flex: 1; height: 3px; background: var(--rule); position: relative; }
.progress-fill { position: absolute; inset: 0 auto 0 0; background: var(--accent); width: 0; }

.nav-group { display: flex; flex-direction: column; gap: 0.15rem; }
.nav-group > .label { padding: 0 0.6rem 0.35rem; }
.nav a {
  display: grid; grid-template-columns: 2.9rem minmax(0, 1fr) auto; align-items: baseline; gap: 0.4rem;
  padding: 0.32rem 0.6rem; border-left: 2px solid transparent;
  color: var(--lead); text-decoration: none; font-size: 0.95rem; line-height: 1.35;
}
.nav a:hover { color: var(--ink); }
.nav a[aria-current="page"] {
  color: var(--ink); border-left-color: var(--accent);
  background: color-mix(in srgb, var(--accent) 9%, transparent);
}
.nav .code { font-family: var(--f-mono); font-size: 0.72rem; letter-spacing: 0.04em; color: var(--lead); }
.tick {
  width: 0.62rem; height: 0.62rem; border: 1px solid var(--rule); align-self: center;
}
.tick.on { background: var(--accent); border-color: var(--accent); }

.sheet {
  min-width: 0;
  max-width: 47rem;
  padding-block: 2.6rem 5rem;
  display: flex; flex-direction: column; gap: 2.4rem;
}
.sheet:focus { outline: none; }

/* ---------- type ---------- */
.titleblock { display: flex; flex-direction: column; gap: 0.8rem; }
.meta-row { display: flex; flex-wrap: wrap; gap: 0.4rem 1.2rem; }
.meta-row .label b { color: var(--ink); font-weight: 500; }
h1 {
  font-family: var(--f-display); font-stretch: 66%; font-weight: 850;
  font-size: clamp(2.5rem, 6.2vw, 4.4rem); line-height: 0.92; letter-spacing: 0.005em;
  text-transform: uppercase; margin: 0; text-wrap: balance;
}
h2 {
  font-family: var(--f-display); font-stretch: 78%; font-weight: 700;
  font-size: 1.05rem; letter-spacing: 0.09em; text-transform: uppercase;
  margin: 0; padding-bottom: 0.5rem; border-bottom: 1px solid var(--rule);
  display: flex; justify-content: space-between; align-items: baseline; gap: 1rem;
}
h2 .label { letter-spacing: 0.06em; }
.lede { font-size: 1.22rem; line-height: 1.5; margin: 0; max-width: 40rem; }
p { margin: 0; max-width: 40rem; }
section { display: flex; flex-direction: column; gap: 1rem; }
.prose { display: flex; flex-direction: column; gap: 0.9rem; }

.chips { display: flex; flex-wrap: wrap; gap: 0.4rem; align-items: center; }
.chip {
  font-family: var(--f-mono); font-size: 0.72rem; letter-spacing: 0.03em;
  padding: 0.2rem 0.5rem; border: 1px solid var(--rule); color: var(--ink);
}

ol.drills { margin: 0; padding: 0; list-style: none; counter-reset: d; display: flex; flex-direction: column; gap: 0.9rem; max-width: 40rem; }
ol.drills > li { counter-increment: d; display: grid; grid-template-columns: 2.2rem minmax(0, 1fr); gap: 0.5rem; }
ol.drills > li::before {
  content: counter(d, decimal-leading-zero); font-family: var(--f-mono); font-size: 0.78rem;
  color: var(--sepia); padding-top: 0.28rem;
}
ul.plain { margin: 0; padding-left: 1.1rem; display: flex; flex-direction: column; gap: 0.4rem; max-width: 40rem; }

.callout {
  border-left: 3px solid var(--sepia); padding: 0.2rem 0 0.2rem 1rem;
  display: flex; flex-direction: column; gap: 0.35rem; max-width: 40rem;
}
.callout .label { color: var(--sepia); }
blockquote {
  margin: 0; font-family: var(--f-display); font-stretch: 75%; font-weight: 600;
  font-size: clamp(1.5rem, 3.4vw, 2.1rem); line-height: 1.12; text-wrap: balance; max-width: 36rem;
}
.cite { font-family: var(--f-mono); font-size: 0.75rem; color: var(--lead); }

/* ---------- tables ---------- */
.table-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 0.95rem; line-height: 1.45; }
th {
  font-family: var(--f-mono); font-weight: 500; font-size: 0.7rem; letter-spacing: 0.07em; text-transform: uppercase;
  color: var(--lead); text-align: left; padding: 0 0.8rem 0.5rem 0; border-bottom: 1px solid var(--ink); white-space: nowrap;
}
td { padding: 0.6rem 0.8rem 0.6rem 0; border-bottom: 1px solid var(--rule); vertical-align: top; }
td.num, th.num { font-variant-numeric: tabular-nums; white-space: nowrap; }
td .mono { font-size: 0.8rem; }
tr.rowlink { cursor: pointer; }
tr.rowlink:hover td { background: color-mix(in srgb, var(--accent) 6%, transparent); }

/* ---------- examples ---------- */
.ex-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 15.5rem), 1fr)); gap: 1rem; }
.ex {
  display: flex; flex-direction: column; gap: 0.45rem;
  padding: 1rem 1.1rem 1.05rem; border: 1px solid var(--rule); background: var(--surface);
  color: var(--ink); text-decoration: none; min-width: 0;
}
.ex:hover { border-color: var(--accent); }
.ex-head { display: flex; justify-content: space-between; gap: 0.6rem; }
.ex-title { font-family: var(--f-display); font-stretch: 82%; font-weight: 700; font-size: 1.12rem; line-height: 1.15; }
.ex-med { font-family: var(--f-mono); font-size: 0.74rem; line-height: 1.5; color: var(--lead); }
.ex-look { font-size: 0.95rem; line-height: 1.5; }
.ex-go { margin-top: auto; padding-top: 0.4rem; font-family: var(--f-mono); font-size: 0.74rem; color: var(--accent); letter-spacing: 0.03em; }
.note { font-size: 0.92rem; color: var(--lead); }

/* ---------- figures ---------- */
figure { margin: 0; border: 1px solid var(--rule); background: var(--surface); display: flex; flex-direction: column; }
figure canvas { display: block; width: 100%; }
.fig-body { padding: 1rem; display: flex; flex-direction: column; gap: 0.9rem; }
figcaption { padding: 0.75rem 1rem; border-top: 1px solid var(--rule); font-size: 0.9rem; color: var(--lead); }
.controls { display: flex; flex-wrap: wrap; gap: 0.8rem 1.4rem; align-items: end; }
.ctl { display: flex; flex-direction: column; gap: 0.2rem; min-width: 8.5rem; flex: 1 1 8.5rem; }
.ctl label { font-family: var(--f-mono); font-size: 0.7rem; letter-spacing: 0.05em; text-transform: uppercase; color: var(--lead); display: flex; justify-content: space-between; gap: 0.5rem; }
.ctl output { color: var(--ink); font-variant-numeric: tabular-nums; }
input[type="range"] { width: 100%; accent-color: var(--accent); }
.row-cap { font-family: var(--f-mono); font-size: 0.72rem; letter-spacing: 0.05em; text-transform: uppercase; color: var(--lead); }

.hero-field { border-block: 1px solid var(--ink); background: var(--surface); position: relative; }
.hero-field canvas { display: block; width: 100%; height: 190px; }
.hero-field .btn { position: absolute; right: 0.6rem; bottom: 0.6rem; background: var(--surface); }

pre {
  margin: 0; background: var(--surface); border: 1px solid var(--rule); padding: 1rem;
  overflow-x: auto; font-family: var(--f-mono); font-size: 0.8rem; line-height: 1.55; color: var(--ink);
}
.code-head { display: flex; justify-content: space-between; align-items: center; gap: 1rem; }

/* ---------- controls ---------- */
.btn {
  font-family: var(--f-mono); font-size: 0.74rem; letter-spacing: 0.06em; text-transform: uppercase;
  border: 1px solid var(--ink); background: transparent; color: var(--ink);
  padding: 0.5rem 0.85rem; cursor: pointer; line-height: 1.2;
}
.btn:hover { background: color-mix(in srgb, var(--ink) 8%, transparent); }
.btn[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.done-row { display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; padding-top: 1.2rem; border-top: 1px solid var(--rule); }

.pager { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
.pager a {
  display: flex; flex-direction: column; gap: 0.2rem; padding: 0.9rem 0; text-decoration: none; color: var(--ink);
  border-top: 2px solid var(--ink); min-width: 0;
}
.pager a.next { text-align: right; }
.pager .pg-title { font-family: var(--f-display); font-stretch: 80%; font-weight: 700; font-size: 1.1rem; line-height: 1.2; }
.pager a:hover .pg-title { color: var(--accent); }

/* checklist */
.checklist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 0.55rem; max-width: 40rem; }
.checklist label { display: grid; grid-template-columns: 1.4rem minmax(0, 1fr); gap: 0.5rem; align-items: start; cursor: pointer; }
.checklist input { accent-color: var(--accent); width: 1.05rem; height: 1.05rem; margin-top: 0.3rem; }

/* rubric scorer */
.seg { display: inline-flex; border: 1px solid var(--ink); }
.seg input { position: absolute; opacity: 0; width: 1px; height: 1px; pointer-events: none; }
.seg label {
  font-family: var(--f-mono); font-size: 0.8rem; padding: 0.3rem 0.65rem; cursor: pointer;
  border-left: 1px solid var(--ink); font-variant-numeric: tabular-nums;
}
.seg label:first-of-type { border-left: 0; }
.seg input:checked + label { background: var(--ink); color: var(--paper); }
.seg input:focus-visible + label { outline: 2px solid var(--accent); outline-offset: 2px; }
.score-line { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0.6rem 1.4rem; }
.score-total { font-family: var(--f-display); font-stretch: 66%; font-weight: 850; font-size: 3.4rem; line-height: 1; font-variant-numeric: tabular-nums; }
.verdict { font-size: 1.02rem; }
.verdict.pass { color: var(--accent); }
.verdict.redo { color: var(--sepia); }

/* swatches */
.swatches { display: flex; flex-wrap: wrap; gap: 0.8rem; }
.swatch { display: flex; flex-direction: column; gap: 0.35rem; width: 6.2rem; }
.swatch span:first-child { display: block; height: 3.2rem; border: 1px solid var(--rule); }

/* ---------- phone ---------- */
@media (max-width: 880px) {
  .app { grid-template-columns: minmax(0, 1fr); gap: 0; }
  .topbar {
    display: flex; justify-content: space-between; align-items: center; gap: 1rem;
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 6;
    background: var(--paper); border-bottom: 1px solid var(--ink); padding-block: 0.7rem;
  }
  .topbar .brand-title { font-size: 1.2rem; }
  .nav { display: none; position: static; max-height: none; padding-block: 1.2rem 1.6rem; border-bottom: 1px solid var(--rule); }
  .nav.open { display: flex; }
  .nav .brand { display: none; }
  .sheet { padding-block: 1.8rem 4rem; gap: 2rem; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; transition: none !important; } }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <a class="brand-title" href="#overview">Drawing like Lebbeus Woods</a>
    <button class="btn" id="navToggle" aria-expanded="false" aria-controls="nav">Contents</button>
  </header>
  <nav class="nav" id="nav" aria-label="Course contents"></nav>
  <main class="sheet" id="view" tabindex="-1"></main>
</div>

<script>
/* ============================================================
   Course content. Facts carry their source on the Sources sheet.
   ============================================================ */

const MODULES = [
  {
    id: 'm1', n: 1, part: 1, week: '1', title: 'Line as vector',
    idea: 'Every line is a force with direction and magnitude. In 2011 he wrote that a straight line carries both, and that any curve can be built from straight lines. This week, make three directions read as three different forces.',
    trains: ['Line as vector', 'Non-Euclidean form'],
    drills: [
      'Fill an 18x24 sheet with straight lines in three dominant directions, straightedge only. Vary pressure so each direction reads as its own force.',
      'Draw a weight ladder: ten parallel lines from barely visible to fully loaded, same pencil. Repeat until the steps are even.',
      'Build a hyperbolic paraboloid from 40+ straight lines spanning two skewed edges, then a twisted band. The figure below is the construction to copy by hand.'
    ],
    figure: 'ruled',
    output: 'Six sheets.',
    test: 'Mask everything but one direction of lines. Can you still tell it from the other two by weight and spacing alone?',
    examples: [
      { title: 'Untitled (Einstein Tomb)', year: '1980', where: 'SFMOMA', med: 'Ink on board, 14 5/8 x 23 in.', url: 'https://www.sfmoma.org/artwork/2019.291/',
        look: 'Ink gives no erasing and no smudged tone. How do weight and spacing alone separate near from far?' },
      { title: 'Sketch for Einstein Tomb', year: '1980', where: 'SFMOMA', med: 'Sketch for Pamphlet Architecture 6', url: 'https://www.sfmoma.org/artwork/2019.142/',
        look: 'Set it beside the finished ink sheet. Which lines survived into the final, and which were search lines?' }
    ]
  },
  {
    id: 'm2', n: 2, part: 1, week: '2', title: 'Tone by accumulation',
    idea: 'Value comes from line density, never from smudging. A Brooklyn Rail critic noted that his detail can pass for an engraving.',
    trains: ['Engraving-level detail', 'Fields, not objects'],
    drills: [
      'Make a nine-step value scale from parallel hatching only. Then make it again with crosshatching at acute angles, 15 to 30 degrees apart.',
      'Draw a real machine part at 2x scale: a carburetor, a vise, a pump housing. All value comes from hatching.',
      'Layer it: graphite base, colored pencil over, then burnish two or three planes so they read as metal.'
    ],
    figure: 'hatch',
    output: 'Both value scales and one finished machine study.',
    test: 'Pin it up and step back 2 m. Does the study read as a print?',
    examples: [
      { title: 'Photon Kite, from Centricity', year: '1988', where: 'SFMOMA', med: 'Graphite on paper, 24 x 22 in.', url: 'https://www.sfmoma.org/artwork/2001.156/',
        look: 'The drawing the Brooklyn Rail critic mistook for an engraving, in graphite alone. Up close, is the dark built from crossed lines, from pressure, or both?' },
      { title: 'Centricity Series, Upper Chamber, Neomechanical Tower', year: '1987', where: 'SFMOMA', med: 'Pencil on paper, 30 1/4 x 29 in.', url: 'https://www.sfmoma.org/artwork/2019.4/',
        look: 'An interior in pencil only. Where is the lightest value on the sheet, and is it bare paper or lifted out?' }
    ]
  },
  {
    id: 'm3', n: 3, part: 1, week: '3', title: 'The ground',
    idea: 'Start from a mid-tone so you can work darker and lighter at once. Urban Realm describes his technique as a rubbed colored-chalk ground with fine colored pencil over it.',
    trains: ['Layered media'],
    drills: [
      'Optional first layer: a thin sepia wash, dried flat.',
      'Shave chalk or pastel onto the sheet and rub it in with a cotton pad in broad directional strokes.',
      'Fix lightly.',
      'Lift lights with the kneaded and electric erasers. Use the erasing shield for hard edges.',
      'Fine colored pencil for edges and structure, graphite for the darks.'
    ],
    output: 'Three grounds (warm, cool, mixed), then one tower growing out of a landscape on the best of them.',
    test: 'Squint at the sheet. Do you see three distinct values, or one muddy middle?',
    examples: [
      { title: 'Untitled, from Centricity', year: '1987', where: 'Cooper Hewitt', med: 'Graphite, color pencil, pastel on Strathmore paper, 61 x 58.2 cm', url: 'https://collection.cooperhewitt.org/objects/18668979/',
        look: 'Three media on one sheet. Try to separate what the pastel does from what the pencil does.' },
      { title: 'Geomechanical Tower, from Centricity', year: '1987', where: 'Cooper Hewitt', med: 'Color pencil on Strathmore paper, 51 x 50.8 cm', url: 'https://collection.cooperhewitt.org/objects/18668977/',
        look: 'The museum\'s color readout for this sheet is on the Kit page. Check it against the drawing, then mix your first ground from it.' }
    ]
  },
  {
    id: 'm4', n: 4, part: 2, week: '4', title: 'Machine towers',
    idea: 'Treat a building as an instrument. In Centricity his towers seem to grow from the landscape and read closer to machines than buildings. In a 1988 interview he said he was after double and triple curvature, beyond Euclidean form.',
    trains: ['Non-Euclidean form', 'Series plus text'],
    drills: [
      'Invent one structure that measures or harvests something real: wind, seismic motion, light, water.',
      'Draw a series of six: plan, section, elevation, axonometric, perspective, and one detail at 1:5.',
      'Put compound curvature somewhere, built only from straight lines (Module 1).'
    ],
    output: 'Six views of one structure, plus half a page on what it measures and who operates it.',
    test: 'Could someone build a model from your six views without asking you a single question?',
    examples: [
      { title: 'Lebbeus Woods: Early Drawings', year: '1986-88', where: 'Dezeen', med: 'Centricity and A-City sheets, shown at Friedman Benda, 2012', url: 'https://www.dezeen.com/2012/11/08/lebbeus-woods-early-drawings/amp/',
        look: 'Several Centricity towers on one page, with his 1988 interview quotes. Pick one tower and write down what you think it measures.' },
      { title: 'A-City and 4 Cities and Beyond', year: 'ca. 1982-97', where: 'Getty Research Institute', med: '52 drawings; pen and ink and colored pencil', url: 'https://www.getty.edu/research/special_collections/notable/lebbeus_woods.html',
        look: 'The Getty calls this a conceptual masterplan for an alternate world. Notice how a series of single sheets adds up to a city.' }
    ]
  },
  {
    id: 'm5', n: 5, part: 2, week: '5', title: 'Insertion',
    idea: 'New space goes into old fabric. His Berlin Free Zone (1990-91) imagined spaces that burrow under the city and occupy existing buildings.',
    trains: ['Architecture under pressure', 'Fields, not objects'],
    drills: [
      'Photograph a real building near you. Trace it precisely in hard graphite.',
      'Insert a structure that occupies it from inside or below.',
      'Rule: the existing building stays calm and exact; the insertion is dense and charged.'
    ],
    output: 'Four drawings: existing, insertion, a section through both, and the interior of the new space.',
    test: 'Cover the insertion with your hand. Does the existing building still read as calm and exact?',
    examples: [
      { title: 'Underground Berlin 19, Elevation View', year: '1988', where: 'SFMOMA', med: 'Graphite and pastel on paper, 12 1/2 x 20 1/4 in.', url: 'https://www.sfmoma.org/artwork/2018.13/',
        look: 'An elevation of a world below grade. Where does the existing ground end and the new structure begin?' },
      { title: 'Underground Berlin drawings', year: '1988', where: 'M+, Hong Kong', med: 'Commissioned for an exhibition on Berlin\'s future', url: 'https://mplus.org.hk/en/collection/objects/drawings-underground-berlin-2016831',
        look: 'Made a year before the Wall fell, activating an old rail tunnel that crossed under the border. Read how he treats drawing as research, equal to building.' },
      { title: 'Aerial view, Berlin Free Zone', year: '1990', where: 'Getty Research Institute', med: 'Electrostatic print, colored pencil, pastel and ink on paper', url: 'https://www.getty.edu/research/exhibitions_events/exhibitions/irresistible_decay/loss/woods_aerial.html',
        look: 'An abandoned shell near the Wall, drawn torn open with new structure inside. This is the Module 5 move.' }
    ]
  },
  {
    id: 'm6', n: 6, part: 2, week: '6', title: 'Freespace and heterarchy',
    idea: 'For the Zagreb Free Zone (1991) he set criteria for a freespace: no use decided in advance, no readable order, no fixed meaning. Hierarchy gives way to heterarchy, a network with no top.',
    trains: ['Invented vocabulary'],
    drills: [

const RHINO_SCRIPT = `# Rhino 8 ScriptEditor (Python 3): acute-angle line field for a printed underlay.
# Lines cluster around a few dominant directions; most are short, a few run long.
import math
import random
import rhinoscriptsyntax as rs

N = 600               # number of lines
W, H = 600, 450       # field size in model units (24x18 in at 25 units/in)
DIRS = [12, 31, 147]  # dominant directions, degrees
JITTER = 6            # +/- degrees around each direction
random.seed(7)        # change for a new field

rs.EnableRedraw(False)
for _ in range(N):
    a = math.radians(random.choice(DIRS) + random.uniform(-JITTER, JITTER))
    length = random.triangular(10, 400, 40)  # (low, high, mode): mostly short vectors
    x, y = random.uniform(0, W), random.uniform(0, H)
    dx, dy = math.cos(a) * length / 2, math.sin(a) * length / 2
    rs.AddLine((x - dx, y - dy, 0), (x + dx, y + dy, 0))
rs.EnableRedraw(True)
# Lines can overrun the frame: trim to a rectangle or let the print edge crop them.`;

/* ============================================================
   Drawing (canvas). Colors come from theme tokens on every draw.
   ============================================================ */
const tok = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();

function prepCanvas(cv, cssH) {
  const w = cv.clientWidth || cv.parentElement.clientWidth;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.style.height = cssH + 'px';
  cv.width = Math.round(w * dpr);
  cv.height = Math.round(cssH * dpr);
  const ctx = cv.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, cssH);
  return { ctx, w, h: cssH };
}

// Seeded random so a field can be reproduced.
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
// Triangular distribution, same signature idea as Python's random.triangular(low, high, mode).
function triangular(r, lo, hi, mode) {
  const u = r(), c = (mode - lo) / (hi - lo);
  return u < c ? lo + Math.sqrt(u * (hi - lo) * (mode - lo)) : hi - Math.sqrt((1 - u) * (hi - lo) * (hi - mode));
}

function drawField(cv, cssH, opts) {
  const { ctx, w, h } = prepCanvas(cv, cssH);
  const r = mulberry32(opts.seed);
  const scale = Math.max(w, h) / 600;  // keep line lengths proportional to the canvas
  ctx.strokeStyle = tok('--ink');
  ctx.lineCap = 'round';
  for (let i = 0; i < opts.n; i++) {
    const deg = opts.dirs[Math.floor(r() * opts.dirs.length)] + (r() * 2 - 1) * opts.jitter;
    const a = deg * Math.PI / 180;
    const len = triangular(r, 10, 400, 40) * scale;
    const x = r() * w, y = r() * h;
    const dx = Math.cos(a) * len / 2, dy = -Math.sin(a) * len / 2;  // canvas y points down
    ctx.globalAlpha = 0.28 + r() * 0.6;
    ctx.lineWidth = 0.5 + r() * 0.9;
    ctx.beginPath(); ctx.moveTo(x - dx, y - dy); ctx.lineTo(x + dx, y + dy); ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

function drawRuled(cv) {
  const cssH = Math.min(380, Math.max(260, cv.clientWidth * 0.62));
  const { ctx, w, h } = prepCanvas(cv, cssH);
  const n = +document.getElementById('ruledN').value;
  const hh = +document.getElementById('ruledH').value / 10;
  const rot = +document.getElementById('ruledR').value * Math.PI / 180;
  // Hyperbolic paraboloid z = h*x*y on the square [-1,1]^2. Straight in both x and y.
  const z = (x, y) => hh * x * y;
  const proj = (x, y) => {
    const xr = x * Math.cos(rot) - y * Math.sin(rot);
    const yr = x * Math.sin(rot) + y * Math.cos(rot);
    return [xr, yr * 0.5 - z(x, y) * 0.75];  // simple axonometric
  };
  // Fit to canvas.
  const corners = [[-1, -1], [1, -1], [1, 1], [-1, 1]].map(([x, y]) => proj(x, y));
  const xs = corners.map(c => c[0]), ys = corners.map(c => c[1]);
  const minX = Math.min(...xs), maxX = Math.max(...xs), minY = Math.min(...ys), maxY = Math.max(...ys);
  const s = Math.min((w - 48) / (maxX - minX || 1), (h - 48) / (maxY - minY || 1));
  const ox = w / 2 - s * (minX + maxX) / 2, oy = h / 2 - s * (minY + maxY) / 2;
  const P = (x, y) => { const p = proj(x, y); return [ox + p[0] * s, oy + p[1] * s]; };
  const line = (a, b) => { ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke(); };

  ctx.lineWidth = 1;
  for (let i = 0; i <= n; i++) {
    const t = -1 + 2 * i / n;
    ctx.strokeStyle = tok('--ink'); ctx.globalAlpha = 0.75;
    line(P(t, -1), P(t, 1));           // family 1: constant x
    ctx.strokeStyle = tok('--accent'); ctx.globalAlpha = 0.85;
    line(P(-1, t), P(1, t));           // family 2: constant y
  }
  ctx.globalAlpha = 1; ctx.lineWidth = 2; ctx.strokeStyle = tok('--ink');
  line(P(-1, -1), P(1, -1)); line(P(1, -1), P(1, 1)); line(P(1, 1), P(-1, 1)); line(P(-1, 1), P(-1, -1));
}

function drawHatch(cv, cross) {
  const steps = 9, gap = 6;
  const w0 = cv.clientWidth || 600;
  const cell = Math.max(24, (w0 - gap * (steps - 1)) / steps);
  const labelH = 18;
  const { ctx, w } = prepCanvas(cv, cell + labelH);
  const ink = tok('--ink'), lead = tok('--lead'), rule = tok('--rule');
  ctx.font = '11px ' + tok('--f-mono');
  ctx.textAlign = 'center';
  for (let i = 0; i < steps; i++) {
    const x0 = i * (cell + gap), d = i / (steps - 1);
    ctx.strokeStyle = rule; ctx.lineWidth = 1; ctx.globalAlpha = 1;
    ctx.strokeRect(x0 + 0.5, 0.5, cell - 1, cell - 1);
    ctx.save();
    ctx.beginPath(); ctx.rect(x0 + 1, 1, cell - 2, cell - 2); ctx.clip();
    ctx.strokeStyle = ink; ctx.lineWidth = 0.9;
    const layers = !cross ? [[45, 1]] : d < 0.4 ? [[45, 1]] : d < 0.75 ? [[45, 1], [70, 1]] : [[45, 1], [70, 1], [20, 1]];
    if (i > 0) {
      // Spacing tightens with darkness; parallel-only bottoms out at a minimum spacing.
      const minSp = cross ? 3.2 : 2.4;
      const sp = 16 - (16 - minSp) * (cross ? Math.min(1, d * 1.25) : d);
      layers.forEach(([deg]) => hatchCell(ctx, x0 + cell / 2, cell / 2, cell, deg, Math.max(minSp, sp)));
    }
    ctx.restore();
    ctx.fillStyle = lead;
    ctx.fillText(String(i), x0 + cell / 2, cell + 13);
  }
}
function hatchCell(ctx, cx, cy, size, deg, sp) {
  const a = deg * Math.PI / 180, dir = [Math.cos(a), -Math.sin(a)], nrm = [Math.sin(a), Math.cos(a)];
  const reach = size;
  for (let k = -reach; k <= reach; k += sp) {
    const px = cx + nrm[0] * k, py = cy + nrm[1] * k;
    ctx.beginPath();
    ctx.moveTo(px - dir[0] * reach, py - dir[1] * reach);
    ctx.lineTo(px + dir[0] * reach, py + dir[1] * reach);
    ctx.stroke();
  }
}

/* ---------- figure state + wiring ---------- */
let heroSeed = 7;
let fieldSeed = 7;

function drawCurrentFigures() {
  const hero = document.getElementById('heroField');
  if (hero) {
    const w = hero.clientWidth;
    drawField(hero, 190, { seed: heroSeed, n: Math.round(w * 0.9), dirs: [12, 31, 147], jitter: 6 });
  }
  const ruled = document.getElementById('ruledCv');
  if (ruled) drawRuled(ruled);
  const ha = document.getElementById('hatchA');
  if (ha) { drawHatch(ha, false); drawHatch(document.getElementById('hatchB'), true); }
  const field = document.getElementById('fieldCv');
  if (field) {
    const v = id => +document.getElementById(id).value;
    const cssH = Math.round(Math.min(420, field.clientWidth * 0.75));  // 24x18 aspect
    drawField(field, cssH, { seed: fieldSeed, n: v('fN'), dirs: [v('fA'), v('fB'), v('fC')], jitter: v('fJ') });
  }
}

function wireView(id) {
  // Overview: clickable schedule rows, hero regenerate.
  document.querySelectorAll('tr.rowlink').forEach(tr => tr.addEventListener('click', e => {
    if (e.target.closest('a')) return;
    location.hash = tr.dataset.go;
  }));
  const regen = document.getElementById('heroRegen');
  if (regen) regen.addEventListener('click', () => { heroSeed = Math.floor(Math.random() * 1e6); drawCurrentFigures(); });

  // Ruled surface controls.
  [['ruledN', 'ruledNo', v => v], ['ruledH', 'ruledHo', v => (v / 10).toFixed(1)], ['ruledR', 'ruledRo', v => v + '°']].forEach(([inp, out, fmt]) => {
    const el = document.getElementById(inp);
    if (!el) return;
    el.addEventListener('input', () => { document.getElementById(out).textContent = fmt(+el.value); drawRuled(document.getElementById('ruledCv')); });
  });

  // Line-field controls.
  [['fN', 'fNo', v => v], ['fA', 'fAo', v => v + '°'], ['fB', 'fBo', v => v + '°'], ['fC', 'fCo', v => v + '°'], ['fJ', 'fJo', v => v + '°']].forEach(([inp, out, fmt]) => {
    const el = document.getElementById(inp);
    if (!el) return;
    el.addEventListener('input', () => { document.getElementById(out).textContent = fmt(+el.value); drawCurrentFigures(); });
  });
  const seedBtn = document.getElementById('fSeed');
  if (seedBtn) seedBtn.addEventListener('click', () => { fieldSeed = Math.floor(Math.random() * 1e6); drawCurrentFigures(); });

  // Copy the Rhino script.
  const copyBtn = document.getElementById('copyCode');
  if (copyBtn) copyBtn.addEventListener('click', () => {
    navigator.clipboard.writeText(RHINO_SCRIPT)
      .then(() => { copyBtn.textContent = 'Copied'; setTimeout(() => { copyBtn.textContent = 'Copy'; }, 1600); })
      .catch(() => {
        // Clipboard refused: select the code so the viewer can copy it themselves.
        const sel = window.getSelection(), range = document.createRange();
        range.selectNodeContents(document.getElementById('codeBlock'));
        sel.removeAllRanges(); sel.addRange(range);
        copyBtn.textContent = 'Selected, press copy';
      });
  });

  // Module done toggle.
  const doneBtn = document.getElementById('doneBtn');
  if (doneBtn) doneBtn.addEventListener('click', () => {
    done[id] = !done[id];
    if (!done[id]) delete done[id];
    store.set('lw-done', done);
    doneBtn.setAttribute('aria-pressed', String(!!done[id]));
    doneBtn.textContent = done[id] ? 'Module done' : 'Mark module done';
    renderNav(id);
  });

  // Capstone checklist.
  document.querySelectorAll('input[data-cap]').forEach(cb => cb.addEventListener('change', () => {
    capChecks[cb.dataset.cap] = cb.checked;
    store.set('lw-capstone', capChecks);
  }));

  // Rubric scorer.
  if (id === 'rubric') {
    const update = () => {
      let total = 0, count = 0;
      RUBRIC.forEach((_, i) => {
        const c = document.querySelector(`input[name="rb${i}"]:checked`);
        if (c) { total += +c.value; count++; scores[i] = +c.value; } else { delete scores[i]; }
      });
      store.set('lw-rubric', scores);
      document.getElementById('scoreTotal').textContent = total;
      const v = document.getElementById('verdict');
      if (count < RUBRIC.length) { v.className = 'verdict'; v.textContent = `${RUBRIC.length - count} of ${RUBRIC.length} rows still unscored.`; }
      else if (total < 10) { v.className = 'verdict redo'; v.textContent = 'Under 10. Redo the weakest sheet before moving on.'; }
      else { v.className = 'verdict pass'; v.textContent = '10 or more. Move to the next module.'; }
    };
    document.querySelectorAll('.seg input').forEach(r => r.addEventListener('change', update));
    document.getElementById('resetScore').addEventListener('click', () => {
      document.querySelectorAll('.seg input').forEach(r => { r.checked = false; });
      update();
    });
    update();
  }
}

/* ============================================================
   Nav + router
   ============================================================ */
function renderNav(current) {
  const groups = [
    ['Start', ROUTES.filter(r => r.group === 'Start')],
    ['Part 1: ' + PARTS[1].name, ROUTES.filter(r => r.group === 'Part 1')],
    ['Part 2: ' + PARTS[2].name, ROUTES.filter(r => r.group === 'Part 2')],
    ['Part 3: ' + PARTS[3].name, ROUTES.filter(r => r.group === 'Part 3')],
    ['Finish', ROUTES.filter(r => r.group === 'Finish')]
  ];
  const doneCount = MODULES.filter(m => done[m.id]).length;
  document.getElementById('nav').innerHTML = `
    <div class="brand">
      <a class="brand-title" href="#overview">Drawing like Lebbeus Woods</a>
      <div class="progress">
        <div class="progress-bar" aria-hidden="true"><div class="progress-fill" style="width:${doneCount * 10}%"></div></div>
        <span class="label">${doneCount}/10 done</span>
      </div>
    </div>
    ${groups.map(([name, items]) => `
      <div class="nav-group">
        <span class="label">${esc(name)}</span>
        ${items.map(r => `
          <a href="#${r.id}" ${r.id === current ? 'aria-current="page"' : ''}>
            <span class="code">${r.code}</span>
            <span>${esc(r.title)}</span>
            ${r.module ? `<span class="tick ${done[r.id] ? 'on' : ''}" aria-label="${done[r.id] ? 'done' : 'not done'}"></span>` : '<span></span>'}
          </a>`).join('')}
      </div>`).join('')}`;
}

function render() {
  const raw = location.hash.slice(1);
  const id = routeById[raw] ? raw : 'overview';
  const view = document.getElementById('view');
  let html;
  if (id === 'overview') html = viewOverview();
  else if (id === 'kit') html = viewKit();
  else if (id === 'rhythm') html = viewRhythm();
  else if (id === 'capstone') html = viewCapstone();
  else if (id === 'rubric') html = viewRubric();
  else if (id === 'reading') html = viewReading();
  else if (id === 'sources') html = viewSources();
  else html = viewModule(modById[id]);
  view.innerHTML = html;
  renderNav(id);
  wireView(id);
  drawCurrentFigures();
  // Close the phone menu and land at the top of the new sheet.
  const nav = document.getElementById('nav');
  nav.classList.remove('open');
  document.getElementById('navToggle').setAttribute('aria-expanded', 'false');
  window.scrollTo(0, 0);
  if (raw) view.focus({ preventScroll: true });
}

document.getElementById('navToggle').addEventListener('click', e => {
  const nav = document.getElementById('nav');
  const open = nav.classList.toggle('open');
  e.currentTarget.setAttribute('aria-expanded', String(open));
});
window.addEventListener('hashchange', render);

// Redraw canvases when the size or theme changes.
let resizeTimer;
window.addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(drawCurrentFigures, 120); });
try { window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', drawCurrentFigures); } catch (e) { /* older browsers */ }
new MutationObserver(drawCurrentFigures).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(drawCurrentFigures);

render();
</script>
